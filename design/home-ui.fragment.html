      function render(){
        root.dataset.palette=design.palette;root.style.setProperty('--o3-button',state.buttonSize+'px');root.style.setProperty('--o3-icon',(state.buttonSize===76?28:26)+'px');root.style.setProperty('--o3-label',(state.buttonSize===76?17:16)+'px');
        const docs=filteredDocs(),folder=state.folders.find(f=>f.id===state.folder);
        for(const view of views){
          const settings=state.screen==='settings';
          if(!view.querySelector('.o3-theme-grid').children.length)view.querySelector('.o3-theme-grid').innerHTML=themes.map(themeMarkup).join('');
          view.dataset.screen=state.screen;
          view.querySelector('.o3-library-content').hidden=settings;
          view.querySelector('.o3-settings-content').hidden=!settings;
          view.querySelector('.o3-settings-content').setAttribute('aria-label',t('settings'));
          view.querySelector('.o3-settings-tabs').setAttribute('aria-label',t('settingsCategories'));
          view.querySelectorAll('[data-settings-tab]').forEach(button=>button.setAttribute('aria-pressed',String(button.dataset.settingsTab===state.settingsTab)));
          view.querySelectorAll('[data-settings-panel]').forEach(panel=>panel.hidden=panel.dataset.settingsPanel!==state.settingsTab);
          view.querySelectorAll('[data-preference]').forEach(control=>{
            const key=control.dataset.preference;
            control.setAttribute('aria-label',t(key));
            if(control.type==='checkbox')control.checked=state.preferences[key];else control.value=state.preferences[key];
          });
          view.querySelector('.o3-theme-grid').setAttribute('aria-label',t('appearance'));
          view.querySelector('.o3-settings-content .o3-size-options').setAttribute('aria-label',t('buttonSize'));
          view.querySelector('.o3-eyebrow').textContent=settings?'SETTINGS':'LIBRARY';
          view.querySelector('[data-action="filter"]').hidden=settings;
          view.querySelector('[data-action="trash"]').hidden=settings;
          view.querySelectorAll('[data-theme]').forEach(button=>{
            const theme=themes.find(theme=>theme.id===button.dataset.theme);
            button.setAttribute('aria-pressed',String(design.palette===theme.id));
            button.setAttribute('aria-label',t(theme.key)+' · '+t(theme.detail));
          });
          view.querySelectorAll('[data-size]').forEach(button=>button.setAttribute('aria-pressed',String(Number(button.dataset.size)===state.buttonSize)));
          view.lang=state.language==='zh'?'zh-CN':'en';view.querySelectorAll('[data-i18n]').forEach(e=>e.textContent=t(e.dataset.i18n));
          view.querySelectorAll('[data-i18n-label]').forEach(e=>{const label=t(e.dataset.i18nLabel);e.setAttribute('aria-label',label);e.dataset.tooltip=label;});
          view.querySelector('.o3-side').setAttribute('aria-label',t('navigation'));view.querySelector('.o3-nav-primary').setAttribute('aria-label',t('libraryNavigation'));view.querySelector('.o3-nav-bottom').setAttribute('aria-label',t('appOptions'));view.querySelector('.o3-utilities').setAttribute('aria-label',t('libraryManagement'));view.querySelector('.o3-create').setAttribute('aria-label',t('createActions'));
          view.querySelector('h1').textContent=t(settings?'settings':state.collection==='favorites'?'favorites':state.collection==='trash'?'trash':'home');
          view.querySelector('[data-action="language"]').setAttribute('aria-label',state.language==='zh'?'Switch to English':'切换为中文');view.querySelector('[data-action="language"]').setAttribute('aria-pressed',String(state.language==='en'));
          view.querySelector('[data-action="language"]').dataset.tooltip=state.language==='zh'?'Switch to English':'切换为中文';
          view.querySelector('[data-action="home"]').setAttribute('aria-current',!settings&&state.collection==='all'&&!state.folder?'page':'false');
          view.querySelector('[data-action="settings"]').setAttribute('aria-current',settings?'page':'false');
          view.querySelector('[data-action="trash"]').setAttribute('aria-pressed',String(state.collection==='trash'));
          view.querySelector('[data-action="favorites"]').setAttribute('aria-pressed',String(!settings&&state.collection==='favorites'));
          view.querySelector('[data-action="favorites"]').setAttribute('aria-current',!settings&&state.collection==='favorites'?'page':'false');
          view.querySelector('.o3-search-field').hidden=!state.searchOpen;
          const field=view.querySelector('input[type="search"]');if(field.value!==state.search)field.value=state.search;field.placeholder=t('searchPlaceholder');field.setAttribute('aria-label',t('searchPlaceholder'));
          view.querySelector('.o3-folder-count').textContent=t('folderCount',{n:state.folders.length});
          view.querySelector('.o3-folder-section').hidden=state.collection==='trash'||!state.folders.length;
          view.querySelector('.o3-create').hidden=state.collection==='trash';
          view.querySelector('.o3-folders').innerHTML=state.folders.map(f=>'<button type="button" class="cursor-interaction" data-folder="'+esc(f.id)+'" aria-pressed="'+String(state.folder===f.id)+'"><i data-lucide="folder" aria-hidden="true"></i><span class="o3-folder-name" data-tooltip="'+esc(f.name)+'">'+esc(f.name)+'</span><small>'+t('fileCount',{n:state.docs.filter(d=>!d.trash&&d.folder===f.id).length})+'</small></button>').join('');
          view.querySelector('.o3-note-title').textContent=state.collection==='trash'?t('removed'):t('myNotes')+(folder?' · '+folder.name:'');
          view.querySelector('.o3-sort-label').textContent=t(state.sort==='name'?'byName':'recent');
          view.querySelector('.o3-doc-grid').innerHTML=docs.length?docs.map(d=>'<button type="button" class="o3-doc cursor-interaction" data-doc="'+esc(d.id)+'" aria-pressed="'+String(state.selected===d.id)+'" aria-label="'+esc(d.name+', '+t('lastOpened',{date:prettyDate(d.date)}))+'"><span class="o3-thumb o3-thumb-'+esc(d.cover)+'" aria-hidden="true">'+thumbnail(d)+'</span><span class="o3-doc-name" data-tooltip="'+esc(d.name)+'">'+esc(d.name)+'</span><time class="o3-doc-date" datetime="'+esc(d.date)+'">'+prettyDate(d.date)+'</time></button>').join(''):'<div class="o3-empty" role="status">'+t('empty')+'</div>';
        }
        icons();scaleFrames();root.dispatchEvent(new CustomEvent('annota:home-render'));
      }
      function scaleFrames(){
        for(const view of views){const frame=view.parentElement;const portrait=view.dataset.view==='portrait';const base=portrait?682.6667:1024;const width=frame.clientWidth||Math.min(root.clientWidth||1024,base);const scale=width/base;view.style.transform='scale('+scale+')';frame.style.height=((portrait?1024:682.6667)*scale)+'px';}
      }
      function toast(message){
        clearTimeout(toastTimer);views.forEach(v=>{const t=v.querySelector('.o3-toast');t.textContent=message;t.hidden=false;});
        toastTimer=setTimeout(()=>views.forEach(v=>v.querySelector('.o3-toast').hidden=true),3200);
      }
      function openModal(view,name){
        modal=name;modalView=view;lastFocused=document.activeElement;
        const overlay=view.querySelector('.o3-overlay'),dialog=view.querySelector('.o3-dialog'),body=view.querySelector('.o3-dialog-body');
        const titles={feedback:t('feedback'),filter:t('filter'),note:t('newNote'),folder:t('newFolder'),import:t('import')};
        dialog.dataset.modal=name;
        const header=view.querySelector('.o3-dialog-header');
        if(name==='feedback')header.innerHTML='<button type="button" class="o3-close cursor-interaction" data-action="close">'+t('cancel')+'</button><h2>'+titles[name]+'</h2>';
        else header.innerHTML='<h2>'+titles[name]+'</h2><button type="button" class="o3-close cursor-interaction" data-action="close">'+t('close')+'</button>';
        dialog.setAttribute('aria-label',titles[name]);
        if(name==='feedback')body.innerHTML='<label><span>'+t('feedbackPrompt')+'</span><textarea maxlength="1000" name="feedback" placeholder="'+t('feedbackPlaceholder')+'">'+esc(state.feedback)+'</textarea></label><label><span>'+t('contact')+'</span><small class="o3-feedback-optional">'+t('optional')+'</small><input type="text" maxlength="120" name="feedback-contact" autocomplete="off" autocapitalize="off" placeholder="'+t('contactPlaceholder')+'" value="'+esc(state.feedbackContact)+'"></label><p class="o3-feedback-error" role="alert" hidden></p><button type="button" class="o3-feedback-submit cursor-interaction" data-action="save-feedback">'+t('submitFeedback')+'</button>';
        if(name==='filter')body.innerHTML='<label>'+t('contentType')+'<select name="kind"><option value="all">'+t('allContent')+'</option><option value="pdf">'+t('pdfFiles')+'</option><option value="note">'+t('handwrittenNotes')+'</option></select></label><label>'+t('sortBy')+'<select name="sort"><option value="recent">'+t('recent')+'</option><option value="name">'+t('byName')+'</option></select></label><button type="button" class="o3-confirm cursor-interaction" data-action="apply-filter">'+t('apply')+'</button>';
        if(name==='note'||name==='folder')body.innerHTML='<label>'+t(name==='note'?'noteName':'folderName')+'<input type="text" name="name" maxlength="36" placeholder="'+t(name==='note'?'untitled':'newFolderName')+'"></label><p class="o3-error" role="alert"></p><button type="button" class="o3-confirm cursor-interaction" data-action="create">'+t(name==='note'?'createNote':'createFolder')+'</button>';
        if(name==='import')body.innerHTML='<label class="o3-import-label"><span><i data-lucide="file-up" aria-hidden="true"></i><br>'+t('choosePdf')+'<input type="file" accept=".pdf,application/pdf" multiple name="files"></span></label><p class="o3-help">'+t('importHelp')+'</p>';
        if(name==='filter'){body.querySelector('[name="kind"]').value=state.kind;body.querySelector('[name="sort"]').value=state.sort;}
        overlay.hidden=false;view.querySelector('.o3-side').inert=true;view.querySelector('.o3-main').inert=true;icons();
        (name==='feedback'?header.querySelector('[data-action="close"]'):(body.querySelector('input:not([type="file"]),textarea,select,button')||header.querySelector('[data-action="close"]'))).focus();
      }
      function closeModal(){
        if(modalView){modalView.querySelector('.o3-overlay').hidden=true;modalView.querySelector('.o3-side').inert=false;modalView.querySelector('.o3-main').inert=false;}modal=null;modalView=null;
        if(lastFocused?.isConnected)lastFocused.focus();lastFocused=null;
      }
      root.addEventListener('click',event=>{
        if(modal==='feedback'&&event.target===modalView.querySelector('.o3-overlay')){closeModal();return;}
        const b=event.target.closest('button');if(!b||!root.contains(b))return;
        const view=b.closest('[data-view]');if(!view)return;
        if(b.dataset.settingsTab){state.settingsTab=b.dataset.settingsTab;render();persist();return;}
        if(b.dataset.theme){const theme=themes.find(theme=>theme.id===b.dataset.theme);if(!theme)return;design.palette=theme.id;render();persist();return;}
        if(b.dataset.size){state.buttonSize=Number(b.dataset.size);render();view.querySelectorAll('[data-size]').forEach(e=>e.setAttribute('aria-pressed',String(Number(e.dataset.size)===state.buttonSize)));persist();return;}
        if(b.dataset.folder){state.folder=state.folder===b.dataset.folder?null:b.dataset.folder;state.collection='all';state.selected=null;render();persist();return;}
        if(b.dataset.doc){
          state.selected=b.dataset.doc;const doc=state.docs.find(d=>d.id===state.selected);
          if(!doc.trash&&(doc.kind==='note'||['p1','guide'].includes(doc.id)||doc.sourceId)){doc.date=localTimestamp();render();root.dispatchEvent(new CustomEvent('annota:open-reader',{detail:{documentId:doc.id,favorite:doc.favorite}}));return;}
          render();persist();toast(t('selected',{name:doc.name}));return;
        }
        switch(b.dataset.action){
          case'home':state.screen='library';state.collection='all';state.folder=null;state.search='';state.searchOpen=false;state.kind='all';state.selected=null;render();persist();break;
          case'search':state.screen='library';state.searchOpen=!state.searchOpen;if(!state.searchOpen)state.search='';render();if(state.searchOpen)view.querySelector('input[type="search"]').focus();persist();break;
          case'favorites':state.collection=state.screen==='library'&&state.collection==='favorites'?'all':'favorites';state.screen='library';state.folder=null;state.selected=null;render();persist();break;
          case'trash':state.collection=state.collection==='trash'?'all':'trash';state.folder=null;state.selected=null;render();persist();break;
          case'language':state.language=state.language==='zh'?'en':'zh';render();persist();break;
          case'settings':state.screen='settings';render();persist();break;
          case'check-update':if(root.dispatchEvent(new CustomEvent('annota:check-update',{cancelable:true,detail:{source:'about',provider:'github-releases',repository:root.annotaProject.repository,userInitiated:true}})))toast(t('updatePending'));break;
          case'feedback':openModal(view,'feedback');break;
          case'filter':openModal(view,'filter');break;
          case'new-note':openModal(view,'note');break;
          case'new-folder':openModal(view,'folder');break;
          case'import':openModal(view,'import');break;
          case'close':closeModal();break;
          case'save-feedback':{
            const field=view.querySelector('[name="feedback"]');
            if(!field.value.trim()){const error=view.querySelector('.o3-feedback-error');error.textContent=t('feedbackRequired');error.hidden=false;field.setAttribute('aria-invalid','true');field.focus();break;}
            state.feedback=field.value;state.feedbackContact=view.querySelector('[name="feedback-contact"]').value;
            closeModal();persist();
            const request=new CustomEvent('annota:submit-feedback',{cancelable:true,detail:{provider:root.annotaProject.feedbackProvider,endpoint:root.annotaProject.feedbackEndpoint,body:state.feedback,contact:state.feedbackContact,userInitiated:true}});
            if(root.dispatchEvent(request))toast(t('feedbackSaved'));
            break;
          }
          case'apply-filter':state.kind=view.querySelector('[name="kind"]').value;state.sort=view.querySelector('[name="sort"]').value;closeModal();render();persist();break;
          case'create':{
            const name=view.querySelector('[name="name"]').value.trim();const error=view.querySelector('.o3-error');
            if(!name){error.textContent=t('nameRequired');break;}
            if(modal==='folder'){
              if(state.folders.some(f=>f.name===name)){error.textContent=t('duplicateFolder');break;}
              if(state.folders.length>=12){error.textContent=t('maxFolders');break;}
              state.folders.push({id:'f-'+Date.now(),name});
            }else{
              if(state.docs.length>=20){error.textContent=t('maxFiles');break;}
              state.docs.unshift({id:'n-'+Date.now(),name,kind:'note',cover:'generic',folder:state.folder,favorite:false,trash:false,date:localTimestamp()});state.collection='all';state.kind='all';state.search='';
            }
            closeModal();render();persist();toast(t('created',{name}));break;
          }
        }
      });
      root.addEventListener('input',event=>{
        if(event.target.matches('.o3-search-field input[type="search"]')){state.search=event.target.value;render();persist();}
        if(event.target.matches('[name="feedback"]')){event.target.removeAttribute('aria-invalid');event.target.closest('.o3-dialog').querySelector('.o3-feedback-error').hidden=true;}
      });
      root.addEventListener('change',event=>{
        const key=event.target.dataset.preference;
        if(key){
          if(key==='haptics')state.preferences.haptics=event.target.checked;
          else if(preferenceOptions[key]?.includes(event.target.value))state.preferences[key]=event.target.value;
          render();persist();return;
        }
        if(!event.target.matches('input[type="file"][name="files"]'))return;
        const files=Array.from(event.target.files||[]).filter(f=>/\.pdf$/i.test(f.name)).slice(0,Math.max(0,20-state.docs.length));
        files.forEach((f,i)=>state.docs.unshift({id:'p-'+Date.now()+'-'+i,name:f.name.slice(0,120),kind:'pdf',cover:'generic',folder:state.folder,favorite:false,trash:false,date:localTimestamp()}));
        closeModal();state.collection='all';state.kind='all';state.search='';render();persist();toast(files.length?t('importAdded',{n:files.length}):t('importError'));
      });
      root.addEventListener('keydown',event=>{
        if(event.key==='Escape'&&modal){event.preventDefault();closeModal();return;}
        if(event.key==='Tab'&&modalView){
          const focusable=Array.from(modalView.querySelector('.o3-dialog').querySelectorAll('button,input,textarea,select')).filter(e=>!e.disabled);
          const first=focusable[0],last=focusable[focusable.length-1];if(event.shiftKey&&document.activeElement===first){event.preventDefault();last.focus();}else if(!event.shiftKey&&document.activeElement===last){event.preventDefault();first.focus();}
        }
      });
      root.addEventListener('annota:reader-change',event=>{readerSnapshot=event.detail;persist();});
      root.addEventListener('annota:document-opened',event=>{const doc=state.docs.find(d=>d.id===event.detail?.documentId);if(doc){doc.date=localTimestamp();render();persist();root.dispatchEvent(new CustomEvent('annota:document-meta',{detail:{documentId:doc.id,favorite:doc.favorite}}));}});
      root.addEventListener('annota:toggle-favorite',event=>{const doc=state.docs.find(d=>d.id===event.detail?.documentId);if(doc&&!doc.trash){doc.favorite=!doc.favorite;render();persist();root.dispatchEvent(new CustomEvent('annota:document-meta',{detail:{documentId:doc.id,favorite:doc.favorite}}));}});
      root.addEventListener('annota:navigate',event=>{const d=event.detail||{},view=views.find(v=>v.dataset.view===d.view)||views[0];state.screen=d.screen==='feedback'?'library':'settings';state.settingsTab=d.tab==='about'?'about':'appearance';render();persist();if(d.screen==='feedback')openModal(view,'feedback');});
      function openExternal(url,source){const request=new CustomEvent('annota:open-external',{cancelable:true,detail:{url,source,userInitiated:true}});if(root.dispatchEvent(request))window.open(url,'_blank','noopener,noreferrer');}
      root.addEventListener('annota:open-project',event=>{const repo=root.annotaProject.repository;if(!repo){toast(state.language==='en'?'The GitHub project address will be announced soon.':'GitHub 项目地址即将公布。');return;}openExternal('https://github.com/'+repo,'guide');});
      root.annotaLibrary={
        document:id=>state.docs.find(d=>d.id===id),
        documents:()=>state.docs,
        folders:()=>state.folders,
        language:()=>state.language,
        message:toast,
        createNote(options){
          if(state.docs.length>=20){toast(t('maxFiles'));return null;}
          const doc={id:'n-'+Date.now(),name:t('untitled'),kind:'note',cover:'generic',folder:state.folder,favorite:false,trash:false,date:localTimestamp(),paperStyle:options.paperStyle,paperColor:options.paperColor};
          state.docs.unshift(doc);state.collection='all';state.kind='all';state.search='';render();persist();
          root.dispatchEvent(new CustomEvent('annota:open-reader',{detail:{documentId:doc.id,favorite:false}}));return doc.id;
        },
        action(action,id,value){
          const doc=state.docs.find(d=>d.id===id);if(!doc)return false;
          if(action==='favorite')doc.favorite=!doc.favorite;
          if(action==='rename'){if(!String(value).trim())return false;doc.name=String(value).trim().slice(0,120);}
          if(action==='move')doc.folder=state.folders.some(f=>f.id===value)?value:null;
          if(action==='paper-color'&&['white','gray','black'].includes(value))doc.paperColor=value;
          if(action==='trash')doc.trash=true;
          if(action==='restore')doc.trash=false;
          if(action==='duplicate'){
            if(state.docs.length>=20){toast(t('maxFiles'));return false;}
            const copy={...doc,id:'d-'+Date.now(),name:doc.name+(state.language==='zh'?' 副本':' copy'),sourceId:doc.sourceId||(['p1','guide'].includes(doc.id)?doc.id:null),favorite:false,date:localTimestamp()};
            state.docs.unshift(copy);root.dispatchEvent(new CustomEvent('annota:clone-document',{detail:{from:id,to:copy.id}}));
          }
          render();persist();root.dispatchEvent(new CustomEvent('annota:document-meta',{detail:{documentId:id,favorite:doc.favorite}}));return true;
        }
      };
      restore(window.openai?.widgetState);render();
      window.addEventListener('openai:set_globals',event=>{if(event.detail?.globals?.widgetState){restore(event.detail.globals.widgetState);render();}});
      new ResizeObserver(scaleFrames).observe(root);
      new MutationObserver(scaleFrames).observe(root.querySelector('.viz-carousel'),{attributes:true,subtree:true,attributeFilter:['hidden']});
    })();
  </script>
