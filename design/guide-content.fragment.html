      <p class="g-read-exercise g-hand">试试看：选中 attention，复制一次，再查一次。</p>
    </div><div class="g-read-copy">
      <h3>先把页面打开</h3><p>一次看一页，或者并排看两页对照。</p><p>缩略图点一下跳页。长按复制、旋转、清除批注或删页；列表底部点「新增页面」。</p>
      <h3>生词，就在旁边查</h3><p>手形工具选中文字，浮出的菜单里点「复制」或「翻译」。</p>
      <div class="g-lookup-mini"><strong>attention</strong><i data-lucide="arrow-right" aria-hidden="true"></i><span>注意；注意力</span></div>
      <p>也能直接打开右上角字典，用键盘或系统手写输入。支持英汉、汉英查词，不翻整句。</p>
    </div></div>
    <footer><button type="button" class="g-link cursor-interaction" data-guide-action="sample">去示例里试一下<i data-lucide="arrow-up-right" aria-hidden="true"></i></button><span>02 / 05</span></footer>
  </article>
  <article class="ar-guide-page" data-guide-page="3" aria-label="使用指南：书写与批注">
    <header><strong>Annota</strong><span>使用指南 / 批注</span></header>
    <h2>选一支笔，<span class="g-mark">写一句</span></h2><p class="g-intro">点顶部中间的笔，展开菜单选笔种、粗细和颜色。要翻页的时候切回手形工具。</p>
    <div class="g-pen-grid">
      <button type="button" class="g-pen-sample cursor-interaction" data-guide-tool="pen" aria-label="试用笔"><div class="g-pen-name"><i data-lucide="pen-line" aria-hidden="true"></i><h3>笔</h3></div><p>日常记录就用它，<br>圈划、写字不用来回换。</p><svg class="g-stroke" viewBox="0 0 150 28" role="img" aria-label="蓝色笔迹示范"><path d="M5 19 C25 25 30 3 47 8 S75 30 93 12 S123 6 145 16" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg></button>
      <button type="button" class="g-pen-sample cursor-interaction" data-guide-tool="pencil" aria-label="试用铅笔"><div class="g-pen-name"><i data-lucide="pencil" aria-hidden="true"></i><h3>铅笔</h3></div><p>颜色淡一些，随手勾个草稿，<br>或记下还没想定的事。</p><svg class="g-stroke" viewBox="0 0 150 28" role="img" aria-label="柔和的铅笔笔迹示范"><path d="M5 19 C25 25 30 3 47 8 S75 30 93 12 S123 6 145 16" fill="none" stroke="#6D785F" stroke-width="1.5" opacity=".65" stroke-linecap="round"/></svg></button>
      <button type="button" class="g-pen-sample cursor-interaction" data-guide-tool="fountain" aria-label="试用钢笔"><div class="g-pen-name"><i data-lucide="pen-tool" aria-hidden="true"></i><h3>钢笔</h3></div><p>下笔有轻重，<br>线条也有粗细。</p><svg class="g-stroke" viewBox="0 0 150 28" role="img" aria-label="粗细变化的钢笔笔迹示范"><path d="M5 19 C25 25 30 3 47 8 S75 30 93 12 S123 6 145 16" fill="none" stroke="#262A2D" stroke-width="2" stroke-linecap="round"/><path d="M47 8 C63 13 71 28 88 17 M111 7 C122 5 134 10 144 16" fill="none" stroke="#262A2D" stroke-width="4.5" stroke-linecap="round"/></svg></button>
      <button type="button" class="g-pen-sample cursor-interaction" data-guide-tool="highlight" aria-label="试用荧光笔"><div class="g-pen-name"><i data-lucide="highlighter" aria-hidden="true"></i><h3>荧光笔</h3></div><p>半透明地划过，<br>字还看得清。</p><svg class="g-stroke" viewBox="0 0 150 28" role="img" aria-label="半透明高亮笔迹示范"><path d="M10 18 L140 13" fill="none" stroke="#FFDA4C" stroke-width="14" opacity=".85" stroke-linecap="round"/></svg></button>
    </div>
    <div class="g-practice-row"><div><div class="g-practice-title"><h3>在这儿，写一句。</h3><span class="g-small">点上面的笔，就能开始</span></div><div class="g-practice" data-guide-practice><span class="g-hand">今天读到的，或此刻想到的……</span></div><p class="g-gesture-note">默认双指点击撤销，三指点击重做；这两个手势在设置里改。</p></div><div>
      <p class="g-tool-note"><strong>橡皮</strong> 整笔擦或局部擦。「仅荧光笔」只擦高亮，其他笔迹留着。</p>
      <p class="g-tool-note"><strong>直尺</strong> 拖到位置、转到角度，沿边画线。</p>
      <p class="g-tool-note"><strong>图形</strong> 矩形、圆形、三角形、直线、箭头，用来圈范围或连线。</p>
      <p class="g-tool-note"><strong>图片</strong> 打开系统照片选择器，选好的图插到当前页。</p>
    </div></div>
    <footer><span class="g-hand">写乱了也不要紧。</span><span>03 / 05</span></footer>
  </article>
  <article class="ar-guide-page" data-guide-page="4" aria-label="使用指南：设置">

      <div class="g-theme" style="--tone-bg:#FAFAFA;--tone-side:#D9E8E1;--tone-main:#1C614C;--tone-sub:#BFD4E9"><div class="g-theme-preview"><div><b></b><em></em></div></div><h3>松间</h3><p>深绿配浅蓝，中间用中性色过渡。</p><div class="g-theme-colors"><i style="--tone:#1C614C"></i><i style="--tone:#BFD4E9"></i><i style="--tone:#CB4544"></i><i style="--tone:#D9E8E1"></i><i style="--tone:#262A2D"></i><i style="--tone:#FFFFFF"></i><i style="--tone:#DDDEE0"></i><i style="--tone:#D8B45C"></i></div></div>

      <div class="g-theme" style="--tone-bg:#F7F8F6;--tone-side:#DCE3FC;--tone-main:#4460CE;--tone-sub:#6D785F"><div class="g-theme-preview"><div><b></b><em></em></div></div><h3>蓝调</h3><p>蓝和鼠尾草绿，加一点暖色。</p><div class="g-theme-colors"><i style="--tone:#4460CE"></i><i style="--tone:#6D785F"></i><i style="--tone:#D15129"></i><i style="--tone:#DCE3FC"></i><i style="--tone:#16181B"></i><i style="--tone:#FFFFFF"></i><i style="--tone:#D9C66C"></i><i style="--tone:#B19BBF"></i></div></div>

    </div><div class="g-setting-copy"><h3>笔身动作，按习惯来</h3><p>「手写笔设置」里改笔身动作和震动反馈。具体能调哪些，取决于笔的型号和系统支持。</p><div class="g-setting-example"><span>轻点两下</span><span>笔 / 橡皮</span></div><h3>常用的，交给手势</h3><p>双指、三指点击各做什么，自己选：撤销、重做、切换工具栏，或者关掉。</p><p class="g-small">默认：双指撤销 / 三指重做</p><div class="g-actions"><button type="button" class="g-button cursor-interaction" data-guide-action="appearance">打开设置<i data-lucide="arrow-up-right" aria-hidden="true"></i></button></div></div></div>

  <article class="ar-guide-page" data-guide-page="5" aria-label="使用指南：本地、更新与反馈">
    <header><strong>Annota</strong><span>使用指南 / 本地</span></header>
    <h2>文件<span class="g-mark">留在本地</span></h2><p class="g-intro">Annota 不用注册账号，也没有云端空间。PDF、笔记和批注都在这台设备上。</p>
    <div class="g-body g-local"><div>
      <div class="g-device" aria-label="PDF、笔记和批注都保存在当前设备的示意"><div class="g-device-files"><img data-guide-pdf="1" alt="本地示例论文"><div class="g-device-note"><span class="g-hand">我的想法<br>记在这里。</span></div></div><span class="g-device-caption g-hand">就在这台设备里。</span></div>
      <div class="g-local-copy"><span class="g-hand">断网也能读，也能写。</span><p>阅读、书写和中英查词，都在本机完成。<br>应用只在你主动检查或下载更新，以及提交反馈时联网。</p></div>
    </div><div>
      <div class="g-contact"><h3>有话，就告诉我们</h3><p data-guide-feedback-copy>从主页打开「意见反馈」，写下当时的操作、出现的情况，或你希望怎样改进。联系方式选填；提交时不会自动附带你的文件和笔记。</p><button type="button" class="g-button cursor-interaction" data-guide-action="feedback">提交意见反馈<i data-lucide="arrow-up-right" aria-hidden="true"></i></button></div>
      <div class="g-contact"><h3>想试试新版本</h3><p>在「设置 → 关于 → 检查更新」查看新版本。更新通过项目的 GitHub Releases 发布。</p><button type="button" class="g-link cursor-interaction" data-guide-action="updates">检查更新<i data-lucide="arrow-up-right" aria-hidden="true"></i></button></div>
      <div class="g-contact"><p>在 GitHub 看开发进展和版本说明，也欢迎来提问。</p><button type="button" class="g-link cursor-interaction" data-guide-action="github">GitHub 项目主页<i data-lucide="arrow-up-right" aria-hidden="true"></i></button><span class="g-repo-status" data-guide-repository-status>项目地址即将公布</span></div>
